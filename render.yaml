services:
  - type: web
    name: stockbazar
    runtime: python
    plan: free
    rootDir: .
    healthCheckPath: /api/health
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: stockbazar-db
          property: connectionString
      - key: FRONTEND_FILE
        value: backend/index.html
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: LOW_STOCK_DEFAULT
        value: "5"
      - key: TOKEN_TTL_HOURS
        value: "24"
      - key: MAX_UPLOAD_MB
        value: "4"
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: ENABLE_ADMIN_RESET
        value: "false"
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: stockbazar-db
    databaseName: stockbazar
    plan: free
